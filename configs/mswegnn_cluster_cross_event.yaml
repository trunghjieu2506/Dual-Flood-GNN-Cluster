dataset_parameters:
  storage_mode: memory
  root_dir: data_mswegnn/datasets
  features_stats_file: boundary_aware_cross_event_features_stats.yaml
  previous_timesteps: 1
  normalize: true
  boundary_aware_features: true
  timestep_interval: 7200
  spin_up_time: 0
  time_from_peak: null
  inflow_boundary_nodes: []
  outflow_boundary_nodes: []
  training:
    dataset_summary_file: train.csv
    event_stats_file: boundary_aware_cross_event_train_event_stats.yaml
  testing:
    dataset_summary_file: test.csv
    event_stats_file: boundary_aware_cross_event_test_event_stats.yaml
  dataset_type: mswegnn
  boundary_aware_feature_groups:
    node_type_flags: true
    node_distances: true
    edge_type_flags: true
    edge_boundary_normals: true
    edge_bc_flow: true
  boundary_aware_cache_prefix: boundary_aware_
training_parameters:
  log_path: logs/mswegnn_cluster_boundary_aware_cross_event_bs32.log
  model_dir: saved_models/mswegnn_cluster_boundary_aware_cross_event_bs32
  stats_dir: training_stats/mswegnn_cluster_boundary_aware_cross_event_bs32
  checkpoint_path: null
  num_epochs: 600
  num_epochs_dyn_loss: 0
  batch_size: 32
  learning_rate: 0.0001
  adam_weight_decay: 0
  gradient_clip_value: 0.5
  early_stopping_patience: 15
  val_split_percent: 0.25
  autoregressive:
    enabled: true
    init_num_timesteps: 1
    total_num_timesteps: 6
    timestep_increment: 1
    max_curriculum_epochs: 100
    learning_rate_decay: 0.7
loss_func_parameters:
  node_loss: mse
  edge_loss: mse
  node_loss_weight: 1.0
  edge_pred_loss_scale: 3.0
  edge_loss_weight: 0.4
  use_global_mass_loss: false
  global_mass_loss_scale: 1.4e-09
  global_mass_loss_weight: 0.01
  use_local_mass_loss: false
  local_mass_loss_scale: 1.19e-09
  local_mass_loss_weight: 0.01
  huber:
    delta: 0.15
testing_parameters:
  log_path: null
  output_dir: saved_metrics/mswegnn_cluster_boundary_aware_cross_event_bs32
  rollout_start: 0
  rollout_timesteps: null
model_parameters:
  GCN:
    hidden_features: 64
    num_layers: 3
    activation: relu
    residual: false
    encoder_layers: 0
    encoder_activation: relu
    decoder_layers: 0
    decoder_activation: relu
  EdgeGCN:
    hidden_features: 64
    num_layers: 3
    activation: relu
    residual: false
    encoder_layers: 0
    encoder_activation: relu
    decoder_layers: 3
    decoder_activation: relu
  GAT:
    hidden_features: 64
    use_edge_features: false
    num_layers: 3
    activation: relu
    residual: false
    num_heads: 1
    dropout: 0.0
    add_self_loops: true
    negative_slope: 0.2
    attn_bias: true
    attn_residual: true
    encoder_layers: 0
    encoder_activation: relu
    decoder_layers: 0
    decoder_activation: relu
  EdgeGAT:
    hidden_features: 64
    use_edge_features: true
    num_layers: 3
    activation: relu
    residual: false
    num_heads: 1
    dropout: 0.0
    add_self_loops: true
    negative_slope: 0.2
    attn_bias: true
    attn_residual: true
    encoder_layers: 0
    encoder_activation: relu
    decoder_layers: 3
    decoder_activation: relu
  DUALFloodGNN:
    hidden_features: 64
    num_layers: 3
    activation: relu
    residual: true
    mlp_layers: 3
    encoder_layers: 3
    encoder_activation: relu
    decoder_layers: 3
    decoder_activation: relu
  NodeEdgeGNNAttn:
    hidden_features: 64
    num_layers: 3
    activation: relu
    residual: true
    dropout: 0.0
    negative_slope: 0.2
    attn_mlp_layers: 3
    encoder_layers: 3
    encoder_activation: relu
    decoder_layers: 3
    decoder_activation: relu
  NodeGNN:
    hidden_features: 64
    num_layers: 3
    activation: relu
    mlp_layers: 3
    residual: true
    encoder_layers: 3
    encoder_activation: relu
    decoder_layers: 3
    decoder_activation: relu
  EdgeGNN:
    hidden_features: 64
    num_layers: 3
    activation: relu
    mlp_layers: 3
    residual: true
    encoder_layers: 3
    encoder_activation: relu
    decoder_layers: 3
    decoder_activation: relu
